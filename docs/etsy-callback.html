<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Etsy OAuth redirect target for scripts/etsy-auth.js. Deliberately no
       analytics tag: the page URL carries the one-time authorization code. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Etsy Connection | The Moon Penguin Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root { --cream: #f5f0e8; --warm-white: #faf7f2; --gold: #c9a96e; --dark: #1a1612; --mid: #5c4f3d; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--warm-white); color: var(--dark); font-family: 'Jost', sans-serif; font-weight: 300; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 16px; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 300; margin-bottom: 16px; text-align: center; }
    h1 em { font-style: italic; color: var(--gold); }
    p { font-size: 0.95rem; line-height: 1.8; color: var(--mid); text-align: center; max-width: 480px; margin-bottom: 12px; }
    .code { font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem; background: var(--cream); border: 1px solid var(--gold); padding: 14px 16px; max-width: 520px; width: 100%; word-break: break-all; margin: 16px 0; user-select: all; }
    .btn { display: inline-block; background: var(--dark); color: var(--cream); padding: 14px 36px; font-family: 'Jost', sans-serif; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; border: 0; cursor: pointer; transition: background 0.3s; }
    .btn:hover { background: var(--gold); color: var(--dark); }
  </style>
</head>
<body>
  <h1 id="title">Connecting <em>Etsy</em></h1>
  <p id="msg"></p>
  <div class="code" id="code" hidden></div>
  <button class="btn" id="copy" hidden>Copy code</button>

  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var code = q.get('code'), state = q.get('state'), err = q.get('error');
      var msg = document.getElementById('msg');
      if (err) {
        document.getElementById('title').innerHTML = 'Etsy said <em>no</em>';
        msg.textContent = 'Etsy returned "' + err + '"' + (q.get('error_description') ? ': ' + q.get('error_description') : '') + '. Run the sign-in script again.';
        return;
      }
      if (!code) {
        msg.textContent = 'This page is only used when connecting the shop poster to Etsy.';
        return;
      }
      // The script checks state to make sure this code came from its own request.
      var pasteable = code + ' ' + (state || '');
      msg.textContent = 'Paste this into the terminal where the sign-in script is waiting:';
      var box = document.getElementById('code');
      box.textContent = pasteable;
      box.hidden = false;
      var btn = document.getElementById('copy');
      btn.hidden = false;
      btn.onclick = function () {
        navigator.clipboard.writeText(pasteable).then(function () { btn.textContent = 'Copied'; });
      };
      // Drop the code from the address bar and history once it's on screen.
      history.replaceState(null, '', location.pathname);
    })();
  </script>
</body>
</html>
